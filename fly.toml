# fly.toml app configuration file generated for recipe-website-ai on 2026-02-24T20:30:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'recipe-website-ai'
primary_region = 'arn'

[build]

[env]
  DATABASE_PATH = "/data/recipes.db"

[[mounts]]
  source = "recipe_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[checks]
  [checks.ready]
    type = "http"
    port = 8080
    method = "GET"
    path = "/ready"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
